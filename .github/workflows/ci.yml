name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # The legacy half is .NET Framework 4.8, so this needs Windows.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      # Builds and tests both apps, runs every VS Code task as written, runs the HTTP contract against the legacy and
      # modern apps, proves the disposable workspace and -Compare, and proves the checks can fail.
      - name: Verify everything
        shell: pwsh
        run: ./go.ps1 -Check

      - name: Collect logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          Copy-Item "$([System.IO.Path]::GetTempPath())taxapp-demo\*.log" logs -ErrorAction SilentlyContinue

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: taxapp-demo-logs
          path: logs/*.log
          if-no-files-found: ignore
